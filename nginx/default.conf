# Reverse proxy: API + web app behind one origin, as containers on the compose
# network (they used to run on the host, reached via host.docker.internal —
# which forced the API onto 0.0.0.0 and left the web app unreachable on Linux).
upstream piramida_api {
  server api:3001;
  keepalive 16;
}

upstream piramida_web {
  server web:3000;
  keepalive 16;
}

# Live-availability sockets are held for up to an hour: cap them per client
limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

# The scheme the visitor used. TLS ends at Caddy, so $scheme here is always
# http; passing that on told the web server every page was plain http, and it
# left Strict-Transport-Security off every page. Caddy's own header says https;
# without one (a request straight to this port) it is this hop's scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  # The visitor's own address as $remote_addr, for the socket cap below and
  # for the X-Forwarded-For the API keys its rate limit on. Requests arrive
  # through Cloudflare and Caddy (Caddy trusts Cloudflare and appends to its
  # X-Forwarded-For), so the peer is the docker bridge and the header ends in
  # a Cloudflare edge: without this every visitor behind one edge shared one
  # address. Walking right to left past the hops trusted here leaves the first
  # address nobody vouches for — a header a visitor forges themselves sits to
  # the left of it and is never reached. Cloudflare's ranges are
  # https://www.cloudflare.com/ips/ (checked 2026-10-15).
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Text assets shrink ~5-8x; woff2/webp are already compressed (not listed)
  gzip on;
  gzip_types application/json text/plain text/css application/javascript image/svg+xml;
  gzip_min_length 1024;
  gzip_proxied any;

  # WebSocket upgrade for live availability (longest-prefix match wins over /api/)
  location = /api/ws {
    limit_conn ws_per_ip 20;
    proxy_pass http://piramida_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Long-lived connections; the API pings every 30s
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /api/ {
    # Admin picture uploads are capped at 5 MB by the API; nginx's 1 MB default
    # would reject them first with an opaque 413
    client_max_body_size 6m;
    proxy_pass http://piramida_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location /health {
    proxy_pass http://piramida_api;
    proxy_set_header Host $host;
  }

  # Container liveness only — does not depend on the host API being up
  location = /nginx-health {
    access_log off;
    return 200 'ok';
  }

  # Hashed build assets are immutable — cache aggressively
  location /assets/ {
    proxy_pass http://piramida_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fonts are versioned by filename; safe to cache long
  location /fonts/ {
    proxy_pass http://piramida_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public";
  }

  # Unversioned images from public/ (logo, hero backgrounds, share image,
  # favicons, icons, flags, partner logos). With no policy from here,
  # Cloudflare applied its 4 h default and PageSpeed flagged the logo and the
  # hero. A month, then revalidated by ETag; a picture that must change
  # sooner for returning visitors needs a new file name (or a CDN purge).
  location ~* ^/(?:logo\.svg|hero-[\w-]+\.webp|og-image\.jpg|favicon[\w.-]*|(?:icons|flags|partners)/[\w.-]+)$ {
    proxy_pass http://piramida_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public";
  }

  location / {
    proxy_pass http://piramida_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }
}
