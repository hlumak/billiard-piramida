name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: piramida
          POSTGRES_PASSWORD: piramida
          POSTGRES_DB: piramida
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piramida -d piramida"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://piramida:piramida@localhost:5432/piramida
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the pnpm version from package.json's packageManager field
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      # typecheck and the web tests generate the route tree and messages first
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod

  # The server only pulls these: building on its 1 vCPU / 2 GB took ~3 min a
  # deploy and left the Docker daemon holding ~1 GB. Pull requests just build;
  # main publishes, once the checks pass, as :main and :<commit sha>.
  docker:
    name: Docker images
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # Public values: both end up in every page the site serves
      VITE_SITE_URL: https://billiard-piramida.pl
      VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAFX8pa-ypgfhyR9M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/hlumak/piramida-api:main
            ghcr.io/hlumak/piramida-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VITE_SITE_URL=${{ env.VITE_SITE_URL }}
            VITE_TURNSTILE_SITE_KEY=${{ env.VITE_TURNSTILE_SITE_KEY }}
          tags: |
            ghcr.io/hlumak/piramida-web:main
            ghcr.io/hlumak/piramida-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
