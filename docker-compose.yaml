# Two ways to use this file:
#   docker compose up -d                       local development: Postgres only;
#                                              run `pnpm dev` on the host
#   docker compose --profile app up -d --build the whole site in containers:
#                                              migrations, API, web, nginx on :8080
# Values come from .env next to this file (see .env.example).
# A server sets API_IMAGE / WEB_IMAGE to the images CI publishes and pulls
# them instead of building (README, "Production").
# Docker keeps a container's output forever by default (json-file, no cap):
# rotate it, so the request logs, with visitor addresses in them, neither fill
# the disk nor pile up for good. Up to 5 × 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'
x-database-url: &database-url postgres://${POSTGRES_USER:-piramida}:${POSTGRES_PASSWORD:-piramida}@postgres:5432/${POSTGRES_DB:-piramida}

services:
  postgres:
    # Pinned to the minor release. The pgdata volume uses the PostgreSQL 18+
    # layout (/var/lib/postgresql); a major upgrade needs pg_upgrade or a
    # dump/restore, and a switch to an Alpine image needs one too (collation).
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-piramida}
      # The default suits local development only — set a real one for a deploy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-piramida}
      POSTGRES_DB: ${POSTGRES_DB:-piramida}
    ports:
      # Loopback only: for host tooling (pnpm dev, db:migrate, tests)
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *logging

  migrate:
    profiles: [app]
    build:
      context: .
      target: api
    image: ${API_IMAGE:-piramida-api:local}
    command: ['node', 'src/db/migrate.ts']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    logging: *logging

  api:
    profiles: [app]
    image: ${API_IMAGE:-piramida-api:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-}
      # Same-origin through nginx needs no CORS; list origins only for others
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      META_OEMBED_TOKEN: ${META_OEMBED_TOKEN:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *logging

  web:
    profiles: [app]
    build:
      context: .
      target: web
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    image: ${WEB_IMAGE:-piramida-web:local}
    restart: unless-stopped
    environment:
      # SSR talks to the API container directly, never back through nginx
      INTERNAL_API_URL: http://api:3001
      ROBOTS_DISALLOW_ALL: ${ROBOTS_DISALLOW_ALL:-0}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *logging

  nginx:
    profiles: [app]
    image: nginx:1.30.5-alpine3.24
    restart: unless-stopped
    ports:
      # Put the TLS-terminating proxy in front of this port
      - '127.0.0.1:8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/nginx-health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  pgdata:
  uploads:
